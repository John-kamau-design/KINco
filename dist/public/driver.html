<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Intake - KINco</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-3 max-w-md mx-auto">

  <div class="bg-white rounded-lg shadow-lg border border-gray-300 p-4 space-y-4">
    <!-- DRIVER HEADER -->
    <div class="flex justify-between items-center border-b pb-2">
      <div>
        <h1 class="font-bold text-gray-800 text-lg">INTAKE MILK!</h1>
        <p id="driver-welcome" class="text-xs text-gray-500">Driver View</p>
      </div>
      <button onclick="logout()" class="bg-red-500 text-white text-xs px-2 py-1 rounded">EXIT</button>
    </div>

    <!-- INTAKE FORM -->
    <form onsubmit="confirmAndSubmitIntake(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-gray-600">Enter FARMER ID or KID</label>
        <div class="flex gap-2">
          <input type="text" id="farmer-id-input" required class="flex-1 border p-2 rounded text-sm" placeholder="e.g. 12345678 or KID-7646">
          <button type="button" onclick="verifyFarmer()" class="bg-sky-500 text-white px-3 py-1 rounded text-xs font-bold">FETCH</button>
        </div>
      </div>

      <!-- AUTO-FETCHED FARMER NAME -->
      <div id="farmer-info" class="hidden p-2 bg-sky-50 border border-sky-200 rounded text-xs font-bold text-sky-800">
        Farmer: <span id="farmer-name-display">-</span>
      </div>

      <!-- QUANTITY DROPDOWN (0.5L - 100.0L) -->
      <div>
        <label class="block text-xs font-bold text-gray-600">Litres In Taken</label>
        <select id="litres-select" class="w-full border p-2 rounded text-sm font-semibold bg-white">
          <!-- Populated by JS -->
        </select>
      </div>

      <!-- SHIFT -->
      <div>
        <label class="block text-xs font-bold text-gray-600">Shift</label>
        <select id="shift-select" class="w-full border p-2 rounded text-sm bg-white">
          <option value="MORNING">MORNING</option>
          <option value="EVENING">EVENING</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 rounded shadow">
        SUBMIT INTAKE
      </button>
    </form>

    <!-- INTAKE HISTORY FILTER -->
    <div class="border-t pt-4 space-y-2">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm text-gray-700">Collection Records</h2>
        <select id="timeframe-select" onchange="loadHistory()" class="border text-xs p-1 rounded">
          <option value="TODAY">TODAY</option>
          <option value="7 DAYS">7 DAYS</option>
          <option value="14 DAYS">14 DAYS</option>
          <option value="30 DAYS">30 DAYS</option>
          <option value="2 MONTHS">2 MONTHS</option>
        </select>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border">
          <thead class="bg-gray-200 text-gray-700">
            <tr>
              <th class="p-1 border">Date</th>
              <th class="p-1 border">Farmer</th>
              <th class="p-1 border">Litres</th>
              <th class="p-1 border">Shift</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/driver.js"></script>
</body>
</html>
