<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINco - Driver Collection Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white text-xl shadow">K</div>
      <div>
        <h1 class="text-lg font-bold text-emerald-400 leading-tight">KINco Driver Collection</h1>
        <p class="text-xs text-slate-400">On-Route Milk Intake Entry</p>
      </div>
    </div>
    <button onclick="logout()" class="bg-red-600/80 hover:bg-red-600 text-white font-semibold text-xs px-3 py-2 rounded-lg transition">Sign Out</button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Route Stats Summary -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <p class="text-xs text-slate-400 uppercase font-semibold">Today's Volume</p>
        <p id="stat-liters" class="text-2xl font-bold text-emerald-400 mt-1">0.0 L</p>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <p class="text-xs text-slate-400 uppercase font-semibold">Pickups Made</p>
        <p id="stat-pickups" class="text-2xl font-bold text-white mt-1">0</p>
      </div>
    </div>

    <!-- Collection Input Form -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl space-y-4">
      <h2 class="text-base font-bold text-emerald-400 border-b border-slate-700 pb-2">Record Farmer Collection</h2>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Farmer Code (KID)</label>
        <div class="flex gap-2">
          <input type="text" id="farmer-code-input" placeholder="e.g. FARM-001" 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 uppercase text-sm">
          <button type="button" onclick="searchFarmer()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 rounded-lg font-semibold text-xs border border-slate-600 transition">
            Verify
          </button>
        </div>
        <p id="farmer-info" class="text-xs mt-2 hidden font-semibold text-emerald-300 bg-emerald-950/60 p-2 rounded border border-emerald-500/30"></p>
      </div>

      <form id="collection-form" onsubmit="submitCollection(event)" class="space-y-4">
        <input type="hidden" id="selected-farmer-id">

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Volume (Liters)</label>
          <input type="number" step="0.1" min="0.1" id="volume-input" required placeholder="0.0" 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-lg font-bold focus:outline-none focus:border-emerald-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Cans Count</label>
            <input type="number" min="1" id="cans-input" value="1" required 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Route</label>
            <select id="route-select" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
              <option value="RT-CENTRAL">Central Route</option>
              <option value="RT-NORTH">North Route</option>
              <option value="RT-SOUTH">South Route</option>
            </select>
          </div>
        </div>

        <div id="status-msg" class="hidden p-3 rounded-lg text-xs font-medium"></div>

        <button type="submit" id="submit-btn" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-lg transition shadow-lg">
          Submit Collection
        </button>
      </form>
    </section>

    <!-- Recent Log -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
      <h3 class="text-sm font-bold text-slate-200 mb-3">Today's Route Log</h3>
      <div id="collections-list" class="space-y-2 text-xs text-slate-400">
        <p>Loading summary...</p>
      </div>
    </section>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadSummary();
    });

    async function searchFarmer() {
      const code = document.getElementById('farmer-code-input').value.trim();
      const infoEl = document.getElementById('farmer-info');
      const submitBtn = document.getElementById('submit-btn');
      const farmerIdInput = document.getElementById('selected-farmer-id');

      if (!code) return;

      try {
        const res = await fetch(`/api/collection/farmer/${code}`);
        const data = await res.json();

        if (!res.ok) {
          infoEl.className = 'text-xs mt-2 p-2 rounded bg-red-950/60 text-red-300 border border-red-500/30';
          infoEl.innerText = data.message || 'Farmer not found';
          infoEl.classList.remove('hidden');
          submitBtn.disabled = true;
          farmerIdInput.value = '';
          return;
        }

        farmerIdInput.value = data.farmer.id;
        infoEl.className = 'text-xs mt-2 p-2 rounded bg-emerald-950/60 text-emerald-300 border border-emerald-500/30';
        infoEl.innerText = `Verified: ${data.farmer.full_name || 'Farmer'} (${data.farmer.kid})`;
        infoEl.classList.remove('hidden');
        submitBtn.disabled = false;
      } catch (err) {
        infoEl.className = 'text-xs mt-2 p-2 rounded bg-red-950/60 text-red-300 border border-red-500/30';
        infoEl.innerText = 'Error connecting to server';
        infoEl.classList.remove('hidden');
      }
    }

    async function submitCollection(e) {
      e.preventDefault();
      const statusEl = document.getElementById('status-msg');
      const btn = document.getElementById('submit-btn');

      const payload = {
        farmer_id: document.getElementById('selected-farmer-id').value,
        volume_liters: document.getElementById('volume-input').value,
        can_count: document.getElementById('cans-input').value,
        route_code: document.getElementById('route-select').value
      };

      btn.disabled = true;
      btn.innerText = 'Recording...';

      try {
        const res = await fetch('/api/collection/record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Failed to record collection');

        statusEl.className = 'p-3 rounded-lg text-xs font-semibold bg-emerald-950 text-emerald-200 border border-emerald-500/40';
        statusEl.innerText = `Recorded ${payload.volume_liters}L successfully!`;
        statusEl.classList.remove('hidden');

        document.getElementById('collection-form').reset();
        document.getElementById('farmer-info').classList.add('hidden');
        btn.disabled = true;

        loadSummary();
      } catch (err) {
        statusEl.className = 'p-3 rounded-lg text-xs font-semibold bg-red-950 text-red-200 border border-red-500/40';
        statusEl.innerText = err.message || 'Error recording collection';
        statusEl.classList.remove('hidden');
      } finally {
        btn.innerText = 'Submit Collection';
      }
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/collection/summary');
        const data = await res.json();

        if (res.ok) {
          document.getElementById('stat-liters').innerText = `${data.totalLiters.toFixed(1)} L`;
          document.getElementById('stat-pickups').innerText = data.totalPickups;

          const listEl = document.getElementById('collections-list');
          if (data.recentCollections.length === 0) {
            listEl.innerHTML = '<p class="text-slate-500 italic">No collections recorded today yet.</p>';
          } else {
            listEl.innerHTML = data.recentCollections.slice(0, 5).map(item => `
              <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700/60">
                <div>
                  <p class="font-bold text-slate-200">${item.farmers?.full_name || 'Farmer'} (${item.farmers?.kid || 'N/A'})</p>
                  <p class="text-[10px] text-slate-400">${new Date(item.collected_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                </div>
                <span class="font-mono text-sm font-bold text-emerald-400">${item.volume_liters} L</span>
              </div>
            `).join('');
          }
        }
      } catch (e) {}
    }

    function logout() {
      localStorage.removeItem('kinco_token');
      localStorage.removeItem('kinco_user');
      window.location.href = '/';
    }
  </script>
</body>
</html>
