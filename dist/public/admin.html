<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINco - Admin Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
    <h1 class="text-2xl font-bold text-emerald-400">KINco Admin Control Center</h1>
    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded font-semibold text-sm">Sign Out</button>
  </header>

  <main class="max-w-4xl mx-auto bg-slate-800 p-6 rounded-lg shadow-xl">
    <h2 class="text-xl font-semibold mb-4">System Overview</h2>
    <p class="text-slate-300 mb-6">Welcome, System Administrator. Use this portal to register new drivers, clerks, and view system metrics.</p>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <a href="/clerk.html" class="block p-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-center font-bold">
        Open Clerk Intake & Registration Portal →
      </a>
      <a href="/driver.html" class="block p-4 bg-slate-700 hover:bg-slate-600 rounded-lg text-center font-bold">
        Open Driver Collection Portal →
      </a>
    </div>
  </main>

  <script>
    function logout() {
      localStorage.removeItem('kinco_token');
      localStorage.removeItem('kinco_user');
      window.location.href = '/';
    }
  </script>
</body>
</html>
