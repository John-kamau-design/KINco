<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clerk Dashboard - KINco</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-xl border p-6 space-y-6">
    <div class="flex justify-between items-center border-b pb-4">
      <h1 class="text-2xl font-bold text-sky-600">Welcome Clerk!</h1>
      <button onclick="logout()" class="bg-red-500 text-white font-bold px-4 py-1.5 rounded">LOGOUT</button>
    </div>

    <!-- TABS -->
    <div class="flex gap-2 border-b">
      <button onclick="switchTab('tab-register')" class="bg-sky-500 text-white font-bold px-4 py-2 rounded-t">Register</button>
      <button onclick="switchTab('tab-tank')" class="bg-sky-500 text-white font-bold px-4 py-2 rounded-t">Intake Tank</button>
      <button onclick="switchTab('tab-agrovet')" class="bg-sky-500 text-white font-bold px-4 py-2 rounded-t">Agrovet</button>
      <button onclick="switchTab('tab-payments')" class="bg-sky-500 text-white font-bold px-4 py-2 rounded-t">Payments</button>
    </div>

    <!-- TAB 1: REGISTER FARMER / DRIVER -->
    <div id="tab-register" class="tab-content space-y-4">
      <h2 class="text-lg font-bold">Register Farmer</h2>
      <form onsubmit="registerFarmer(event)" class="max-w-md space-y-3">
        <input type="text" id="reg-name" placeholder="Full Name" required class="w-full border p-2 rounded">
        <input type="text" id="reg-phone" placeholder="Phone Number" required class="w-full border p-2 rounded">
        <input type="text" id="reg-id" placeholder="National ID Number" required class="w-full border p-2 rounded">
        <label class="flex items-center gap-2">
          <input type="checkbox" id="reg-shareholder"> Shareholder (Check if Yes)
        </label>
        <button type="submit" class="bg-green-500 text-white font-bold px-6 py-2 rounded">Submit Registration</button>
      </form>
    </div>

    <!-- TAB 2: INTAKE TANK RECONCILIATION -->
    <div id="tab-tank" class="tab-content hidden space-y-4">
      <h2 class="text-lg font-bold">Tank Reconciliation</h2>
      <form onsubmit="submitReconcile(event)" class="max-w-md space-y-3">
        <input type="number" id="driver-id-input" placeholder="Driver User ID" required class="w-full border p-2 rounded">
        <input type="number" step="0.1" id="offload-amount" placeholder="Enter Offloaded Tank Amount (L)" required class="w-full border p-2 rounded">
        <button type="submit" class="bg-sky-500 text-white font-bold px-6 py-2 rounded">RECORD & RECONCILE</button>
      </form>
    </div>

    <!-- TAB 3: AGROVET -->
    <div id="tab-agrovet" class="tab-content hidden space-y-4">
      <h2 class="text-lg font-bold">Add Agrovet Item</h2>
      <form onsubmit="addAgrovetItem(event)" class="max-w-md space-y-3">
        <input type="text" id="item-name" placeholder="Item Name" required class="w-full border p-2 rounded">
        <input type="number" id="item-qty" placeholder="Quantity" required class="w-full border p-2 rounded">
        <input type="text" id="item-source" placeholder="Received From" required class="w-full border p-2 rounded">
        <button type="submit" class="bg-green-500 text-white font-bold px-6 py-2 rounded">SAVE ITEM</button>
      </form>
    </div>

    <!-- TAB 4: PAYMENTS @ 45 KSH/L -->
    <div id="tab-payments" class="tab-content hidden space-y-4">
      <h2 class="text-lg font-bold">Farmer Payments (@ 45 KSh/L)</h2>
      <div class="flex gap-2">
        <input type="number" id="pay-farmer-id" placeholder="Enter Farmer ID" class="border p-2 rounded">
        <button onclick="processPayAll()" class="bg-blue-600 text-white font-bold px-4 py-2 rounded">PAY ALL UNPAID</button>
      </div>
    </div>
  </div>

  <script src="js/clerk.js"></script>
</body>
</html>
