<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINco - Kinyona Dairy Legends</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PWA Integration -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KINco Hub">
<link rel="apple-touch-icon" href="/icon-192.png">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.error('Service Worker Error:', err));
    });
  }
</script>
</head>
<body class="bg-amber-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white border-2 border-sky-400 rounded-lg shadow-xl overflow-hidden">
    
    <!-- HEADER -->
    <div class="bg-sky-500 text-white text-center py-3 font-bold text-lg border-b-2 border-sky-600 flex justify-between items-center px-4">
      <span>Kinyona Dairy Legends Company</span>
      <button id="logout-btn" onclick="handleLogout()" class="hidden text-xs bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded font-bold">Logout</button>
    </div>

    <!-- VIEW 1: WELCOME SCREEN -->
    <div id="welcome-view" class="p-6 text-center space-y-6">
      <h2 class="text-xl font-semibold text-gray-700">Welcome!!</h2>
      <div class="space-y-4">
        <button onclick="showView('signin-view')" class="w-full bg-sky-400 hover:bg-sky-500 text-white font-bold py-3 rounded shadow border-b-4 border-sky-600">
          SIGN IN
        </button>
        <button onclick="showView('login-view')" class="w-full bg-sky-400 hover:bg-sky-500 text-white font-bold py-3 rounded shadow border-b-4 border-sky-600">
          LOG IN
        </button>
      </div>
    </div>

    <!-- VIEW 2: SIGN IN -->
    <div id="signin-view" class="p-6 hidden space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Sign IN</h2>
      <form id="signin-form" onsubmit="handleSignInCheck(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-600">Full Name</label>
          <input type="text" id="signin-name" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Password</label>
          <div class="relative">
            <input type="password" id="signin-password" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
            <input type="checkbox" onclick="togglePassword('signin-password')" class="absolute right-2 top-2 cursor-pointer">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Phone Number</label>
          <input type="text" id="signin-phone" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">ID Number</label>
          <input type="text" id="signin-id" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        
        <p id="signin-error" class="text-red-500 text-xs hidden font-bold"></p>

        <div class="flex justify-between pt-4">
          <button type="button" onclick="showView('welcome-view')" class="bg-red-400 text-white px-4 py-1.5 rounded font-bold">Back</button>
          <button type="submit" class="bg-sky-500 text-white px-6 py-1.5 rounded font-bold">Submit</button>
        </div>
      </form>
    </div>

    <!-- VIEW 3: LOG IN -->
    <div id="login-view" class="p-6 hidden space-y-4">
      <h2 class="text-lg font-semibold text-gray-700">Log in:</h2>
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-600">ID Number</label>
          <input type="text" id="login-id" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Password</label>
          <div class="relative">
            <input type="password" id="login-password" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
            <input type="checkbox" onclick="togglePassword('login-password')" class="absolute right-2 top-2 cursor-pointer">
          </div>
        </div>

        <p id="login-error" class="text-red-500 text-xs hidden font-bold"></p>

        <div class="flex justify-between pt-4">
          <button type="button" onclick="showView('welcome-view')" class="bg-red-400 text-white px-4 py-1.5 rounded font-bold">Back</button>
          <button type="submit" class="bg-sky-500 text-white px-6 py-1.5 rounded font-bold">Submit</button>
        </div>
      </form>
    </div>

    <!-- VIEW 4: DASHBOARD HOME (Landing view after login) -->
    <div id="dashboard-view" class="p-6 hidden space-y-6">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-semibold text-gray-700">Cooperative Dashboard</h2>
        <span id="user-role-badge" class="text-xs bg-sky-100 text-sky-800 font-bold px-2 py-1 rounded"></span>
      </div>

      <div class="space-y-3 text-center py-4">
        <p class="text-sm text-gray-600">Select an action below to proceed:</p>
        <button onclick="showView('farmer-registration-view')" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded shadow border-b-4 border-sky-600 transition">
          Register New Farmer
        </button>
      </div>
    </div>

    <!-- VIEW 5: FARMER REGISTRATION FORM (Triggered ONLY on button click) -->
    <div id="farmer-registration-view" class="p-6 hidden space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-lg font-semibold text-gray-700">Register New Farmer</h2>
        <button type="button" onclick="showView('dashboard-view')" class="text-xs bg-gray-300 hover:bg-gray-400 text-gray-800 px-2.5 py-1 rounded font-bold">Back</button>
      </div>

      <form id="farmer-form" onsubmit="handleFarmerRegistration(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-gray-600">Full Name</label>
          <input type="text" id="farmer-name" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Phone Number</label>
          <input type="text" id="farmer-phone" required class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">ID Number</label>
          <input type="text" id="farmer-id" class="w-full border-b-2 border-sky-400 p-1 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">Collection Route</label>
          <input type="text" id="farmer-route" class="w-full border-b-2 border-sky-400 p-1 focus:outline-none" placeholder="e.g. Route A">
        </div>

        <p id="farmer-error" class="text-red-500 text-xs hidden font-bold"></p>
        <p id="farmer-success" class="text-green-600 text-xs hidden font-bold"></p>

        <div class="pt-4">
          <button type="submit" class="w-full bg-sky-500 hover:bg-sky-600 text-white py-2 rounded font-bold shadow">
            Save Farmer Record
          </button>
        </div>
      </form>
    </div>

  </div>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script>
    function showView(viewId) {
      ['welcome-view', 'signin-view', 'login-view', 'dashboard-view', 'farmer-registration-view'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(viewId);
      if (target) target.classList.remove('hidden');
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    }

    async function handleFarmerRegistration(e) {
      e.preventDefault();
      const errorEl = document.getElementById('farmer-error');
      const successEl = document.getElementById('farmer-success');
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      const token = localStorage.getItem('kinco_token') || localStorage.getItem('token');
      const payload = {
        full_name: document.getElementById('farmer-name').value,
        phone_number: document.getElementById('farmer-phone').value,
        id_number: document.getElementById('farmer-id').value,
        route: document.getElementById('farmer-route').value
      };

      try {
        const res = await fetch('/api/farmers', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok) {
          const code = data.farmer && data.farmer.farmer_code ? ` (${data.farmer.farmer_code})` : '';
          successEl.textContent = `Farmer registered successfully!${code}`;
          successEl.classList.remove('hidden');
          document.getElementById('farmer-form').reset();
        } else {
          errorEl.textContent = data.error || data.message || 'Failed to register farmer';
          errorEl.classList.remove('hidden');
        }
      } catch (err) {
        errorEl.textContent = 'Server connection failed';
        errorEl.classList.remove('hidden');
      }
    }

    function handleLogout() {
      localStorage.removeItem('kinco_token');
      localStorage.removeItem('token');
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.classList.add('hidden');
      showView('welcome-view');
    }
  </script>
</body>
</html>
